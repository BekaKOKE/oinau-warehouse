# ASCII only: Alembic reads this file with the system locale encoding
# (configparser encoding="locale"), so non-ASCII here breaks `alembic upgrade`
# on Windows. Comments in Russian live in alembic/env.py.
#
# The DSN is deliberately absent: it comes from app settings (.env).

[alembic]
script_location = alembic
prepend_sys_path = .
# Migration filename: 2026_09_09_1430-abc123_add_products.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
version_path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
