[project]
name = "oinau-backend"
version = "0.1.0"
description = "OINAU-PRO backend API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "redis>=5.2",
    "arq>=0.26",
    "aiobotocore>=2.15",
    "pillow>=11.0",
    # Excel-импорт/экспорт каталога. defusedxml openpyxl подключает сам:
    # без него XML книги разбирался бы без защиты от внешних сущностей.
    "openpyxl>=3.1.5",
    "defusedxml>=0.7.1",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "structlog>=24.4",
    "python-multipart>=0.0.12",
    "email-validator>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-aiobotocore[s3]>=2.15",
    "types-openpyxl>=3.1.5",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ------------------------------------------------------------------ ruff
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]
# Уже применённые миграции не переформатируются. Их содержимое —
# слепок схемы на момент выпуска; переписывать его из-за смены правил
# форматирования значит менять историю, которую никто не перечитывает,
# и получать шумный diff в каждом несвязанном этапе.
# Проверки стиля для них отключены тем же списком в lint.per-file-ignores.
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "N",         # pep8-naming
    "UP",        # pyupgrade
    "B",         # bugbear
    "C4",        # comprehensions
    "ASYNC",     # async-специфичные ошибки
    "S",         # bandit: базовая безопасность
    "T20",       # запрет print()
    "SIM",       # упрощения
    "RUF",
]
ignore = [
    "S101",     # assert разрешён в тестах
    "B008",     # Depends() в аргументах — идиома FastAPI
    # Документация и комментарии в проекте на русском языке.
    # Эти правила ищут "похожие на латиницу" символы и на кириллице
    # дают сплошные ложные срабатывания.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "T20"]
# CLI-скрипты общаются с оператором через stdout — это их интерфейс,
# а не забытая отладка
"app/scripts/*" = ["T20"]
"alembic/*" = ["E501", "N999"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ------------------------------------------------------------------ mypy
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
ignore_missing_imports = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ------------------------------------------------------------------ pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: требует поднятых PostgreSQL/Redis/MinIO",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/main.py", "alembic/*"]
